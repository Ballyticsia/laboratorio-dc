name: Backtest de xG

# ¿Mejora el modelo con goles esperados (xG) de Understat? Corre una vez al mes y a mano.
# Guarda el resultado en data/backtest_xg.json; el robot principal usa xG solo si mejora.
on:
  schedule:
    - cron: "41 6 3 * *"     # día 3 de cada mes, 06:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar          # misma fila que el robot principal, para no chocar al guardar
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar librerías
        run: pip install -r requirements.txt
      - name: Correr el backtest
        run: python pipeline/backtest_xg.py
      - name: Guardar el resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_xg.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Backtest de xG $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
            exit 1
          fi
