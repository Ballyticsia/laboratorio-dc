name: Actualizar datos y publicar

on:
  schedule:
    # Cada 2 horas (minuto 17). Así el registro guarda la predicción justo antes de cada partido
    # y los resultados aparecen poco después de terminar.
    - cron: "17 */2 * * *"
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]         # también corre cuando subes cambios al código

permissions:
  contents: write            # para guardar data/ en el repositorio
  issues: write              # para avisar con un issue si la actualización falla
  pages: write               # para publicar el sitio
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # siempre la versión más nueva, aunque la ejecución haya esperado en la fila

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Bajar datos y reajustar el modelo
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # plan Pro de API-Football (7.500 consultas al día, desde el 27-10-2026)
          API_FOOTBALL_MIN_HORAS: "2"   # bajas de cada fecha, como mucho cada 2 horas
          API_FOOTBALL_DIAS: "3"        # de ayer a pasado mañana
          XG_MIN_HORAS: "2"
          XG_MAX_POR_CORRIDA: "60"
          XG_RESERVA: "1500"            # consultas que siempre quedan libres en el día
          FOTOS_MAX: "120"
          FOTOS_RESERVA: "1500"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_MIN_HORAS: "20"      # plan gratis (500 créditos/mes): cada liga se actualiza ~1 vez al día antes de jugar
        run: python pipeline/generar.py

      - name: Revisar datos y código antes de publicar
        run: |
          python pipeline/validar.py
          node --check site/assets/app.js
          node --check site/sw.js

      - name: Guardar datos y registro en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            # Si otra ejecución guardó datos mientras tanto, se quedan los recién calculados
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Avisar si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="La actualización automática falló"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          abierto=$(gh issue list --repo "${{ github.repository }}" --state open --search "$titulo in:title" --json number --jq '.[0].number')
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --repo "${{ github.repository }}" --body "Volvió a fallar: $url"
          else
            gh issue create --repo "${{ github.repository }}" --title "$titulo" --body "Revisa el paso en rojo de esta ejecución: $url. El sitio sigue mostrando los últimos datos buenos."
          fi
