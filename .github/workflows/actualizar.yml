name: Actualizar datos y publicar

on:
  schedule:
    # Tres veces al día (hora UTC). En Chile (UTC-3) son las 06:17, 12:17 y 18:17.
    - cron: "17 9,15,21 * * *"
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]         # también corre cuando subes cambios al código

permissions:
  contents: write            # para guardar data/ en el repositorio
  pages: write               # para publicar el sitio
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Bajar datos y reajustar el modelo
        run: python pipeline/generar.py

      - name: Guardar datos y registro en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
