name: Diagnóstico
on:
  push:
    branches: [diagnostico]
    paths: [diag/perf.sh, .github/workflows/diag.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: bash diag/perf.sh
      - run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -f diag/out && git commit -m "Resultado diagnóstico imágenes" && git push -f origin HEAD:diagnostico
