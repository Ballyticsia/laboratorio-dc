name: Estadísticas por jugador

# Cada 10 minutos baja de API-Football las estadísticas por jugador de los partidos que la gente está
# mirando en el sitio y las deja en el servidor (Cloudflare KV). No hace commits.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jugadores
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JUG_MAX: "25"        # plan Pro: hasta 25 partidos por corrida
      JUG_RESERVA: "1000"  # nunca bajar de esto en el día
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: pipeline
      - name: Bajar estadísticas por jugador
        run: python3 pipeline/jugadores_partido.py
