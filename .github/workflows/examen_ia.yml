name: Examen de la IA

# Hace 20 preguntas fijas a Ballytics IA en la página publicada y revisa las respuestas
# (día correcto, sin cuotas inventadas, juego responsable, listas completas, fuera de tema…).
# Guarda el resultado en data/ia_examen.json. Corre cada lunes, después de cada cambio de código
# publicado y con el botón "Run workflow".
on:
  schedule:
    - cron: "41 15 * * 1"
  workflow_run:
    workflows: ["Actualizar datos y publicar"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: examen-ia
  cancel-in-progress: true

jobs:
  examen:
    # después de publicar, solo si la publicación vino de un cambio de código (no de la actualización cada 2 horas)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/package-lock.json') }}
      - name: Instalar navegador
        run: cd tests && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium >/dev/null
      - name: Esperar a que la página publicada tenga esta versión
        run: sleep 60
      - name: Examen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tests/examen_ia.js
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ia_examen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Examen de la IA $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
